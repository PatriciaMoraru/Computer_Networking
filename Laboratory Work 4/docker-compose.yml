version: "3.9"

services:
  leader:
    build: .
    container_name: kv-leader
    environment:
      ROLE: "leader"
      WRITE_QUORUM: "3"
      MIN_DELAY_MS: "0"
      MAX_DELAY_MS: "1000"
      FOLLOWERS: "kv-f1:8000,kv-f2:8000,kv-f3:8000,kv-f4:8000,kv-f5:8000"
    ports:
      - "8000:8000"    # expose leader to host
    depends_on:
      - f1
      - f2
      - f3
      - f4
      - f5

  f1:
    build: .
    container_name: kv-f1
    environment:
      ROLE: "follower"
      LEADER_URL: "http://leader:8000"

  f2:
    build: .
    container_name: kv-f2
    environment:
      ROLE: "follower"
      LEADER_URL: "http://leader:8000"

  f3:
    build: .
    container_name: kv-f3
    environment:
      ROLE: "follower"
      LEADER_URL: "http://leader:8000"

  f4:
    build: .
    container_name: kv-f4
    environment:
      ROLE: "follower"
      LEADER_URL: "http://leader:8000"

  f5:
    build: .
    container_name: kv-f5
    environment:
      ROLE: "follower"
      LEADER_URL: "http://leader:8000"

  # Test container - runs inside Docker network with access to all services
  tests:
    build: .
    container_name: kv-tests
    environment:
      ROLE: "tester"
    depends_on:
      - leader
      - f1
      - f2
      - f3
      - f4
      - f5
    # Keep container alive for manual test execution
    command: ["sleep", "infinity"]
    volumes:
      - ./tests:/app/tests:ro  # Mount tests as read-only for live updates
